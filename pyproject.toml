[project]
name = "221b"
version = "0.1.0"
description = "221B - forensic incident reconstruction (ALGOTHON'26 ALG-CYBER-01)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.6",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "pandas>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
