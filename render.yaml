# Render Blueprint: New > Blueprint, point it at this repository.
services:
  - type: web
    name: 221b
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: CASE_LIMIT        # analysed cases kept in memory (512 MB instance)
        value: "2"
      - key: MAX_SCALE         # caps generated case size (~32k events, ~150 MB per case)
        value: "0.6"
      - key: MAX_UPLOAD_MB
        value: "25"
