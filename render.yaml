# Render Blueprint: New > Blueprint, point it at this repository.
services:
  - type: web
    name: 221b
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: CASE_LIMIT        # generated/uploaded cases kept in memory besides the pinned demo (512 MB instance)
        value: "1"
      - key: MAX_SCALE         # caps generated case size (~32k events, ~150 MB per case)
        value: "0.6"
      - key: PREWARM_DEMO      # analyse the demo case at boot so opening it is instant
        value: "1"
      - key: MAX_UPLOAD_MB
        value: "25"
